<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lozan Drama</title>
  <meta name="description" content="Lozan Drama — Premium Kurdish & English drama, movie and series streaming with subtitles." />
  <meta name="theme-color" content="#0d0d0d" />

  <!-- Fonts: Inter (LTR) + Vazirmatn (RTL/Kurdish) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- =====================================================================
       CSS
       ===================================================================== -->
  <style>
    /* ---------- Design tokens ---------- */
    :root {
      --bg: #0d0d0d;
      --bg-2: #121212;
      --surface: #1e1e1e;
      --surface-2: #282828;
      --surface-3: #333333;
      --border: #2c2c2c;
      --text: #ffffff;
      --text-dim: #a0a0a0;
      --text-dimmer: #6b6b6b;
      --accent: #00b4d8;
      --accent-2: #00a896;
      --gold: #f5b301;
      --danger: #ef4444;
      --radius: 12px;
      --radius-sm: 8px;
      --header-h: 60px;
      --bottomnav-h: 62px;
      --maxw: 1280px;
      --font: "Vazirmatn", "Inter", system-ui, -apple-system, sans-serif;
      --shadow: 0 8px 30px rgba(0,0,0,.5);
    }
    html[dir="ltr"] { --font: "Inter", "Vazirmatn", system-ui, -apple-system, sans-serif; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: calc(var(--bottomnav-h) + env(safe-area-inset-bottom, 0px));
    }
    img { display: block; max-width: 100%; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, textarea, select { font-family: inherit; }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--accent); color: #001318; }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 20px; }

    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

    /* ---------- Layout helpers ---------- */
    .container { max-width: var(--maxw); margin: 0 auto; padding: 0 16px; width: 100%; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .hidden { display: none !important; }

    /* ============ HEADER ============ */
    .header {
      position: sticky; top: 0; z-index: 100;
      height: var(--header-h);
      background: rgba(13,13,13,.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: .3px; }
    .brand .logo-mark {
      width: 34px; height: 34px; border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid; place-items: center; color: #001318; font-weight: 800; font-size: 15px;
      box-shadow: 0 4px 16px rgba(0,180,216,.35);
    }
    .brand .brand-text { background: linear-gradient(90deg,#fff,#cfeef3); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

    .header-actions { display: flex; align-items: center; gap: 6px; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 10px;
      display: grid; place-items: center; color: var(--text-dim);
      transition: background .15s, color .15s;
    }
    .icon-btn:hover, .icon-btn:focus-visible { background: var(--surface); color: var(--text); }
    .icon-btn.crown { color: var(--gold); }

    .lang-toggle {
      display: inline-flex; align-items: center; background: var(--surface);
      border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 2px;
      font-size: 12px; font-weight: 600;
    }
    .lang-toggle button { padding: 5px 11px; border-radius: 999px; color: var(--text-dim); white-space: nowrap; transition: .15s; }
    .lang-toggle button.active { background: var(--accent); color: #001318; }

    .avatar-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg,#3a3a3a,#1f1f1f);
      display: grid; place-items: center; font-weight: 700; color: #fff;
      border: 1px solid var(--border); overflow: hidden;
    }
    .avatar-btn img { width: 100%; height: 100%; object-fit: cover; }

    /* Desktop nav links */
    .desktop-nav { display: none; align-items: center; gap: 4px; margin: 0 8px; }
    .desktop-nav a { padding: 8px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--text-dim); transition: .15s; white-space: nowrap; }
    .desktop-nav a:hover, .desktop-nav a.active { color: var(--text); background: var(--surface); }

    /* ============ DRAWER ============ */
    .drawer-overlay {
      position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.6);
      backdrop-filter: blur(3px); opacity: 0; visibility: hidden; transition: .25s;
    }
    .drawer-overlay.open { opacity: 1; visibility: visible; }
    .drawer {
      position: fixed; top: 0; bottom: 0; inset-inline-start: 0; z-index: 210;
      width: min(84vw, 320px); background: var(--bg-2); border-inline-end: 1px solid var(--border);
      transform: translateX(-105%); transition: transform .28s cubic-bezier(.4,0,.2,1);
      display: flex; flex-direction: column; padding: 18px;
    }
    html[dir="rtl"] .drawer { transform: translateX(105%); }
    .drawer.open { transform: translateX(0) !important; }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
    .drawer-nav { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
    .drawer-nav a {
      display: flex; align-items: center; gap: 14px; padding: 13px 14px; border-radius: 10px;
      color: var(--text-dim); font-weight: 600; font-size: 15px; transition: .15s;
    }
    .drawer-nav a:hover, .drawer-nav a.active { background: var(--surface); color: var(--text); }
    .drawer-nav a.active { box-shadow: inset 3px 0 0 var(--accent); }
    html[dir="rtl"] .drawer-nav a.active { box-shadow: inset -3px 0 0 var(--accent); }
    .drawer-nav svg { flex: 0 0 auto; }

    /* ============ BOTTOM NAV ============ */
    .bottom-nav {
      position: fixed; inset-inline: 0; bottom: 0; z-index: 150;
      height: calc(var(--bottomnav-h) + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: rgba(18,18,18,.94); backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      display: flex; align-items: stretch; justify-content: space-around;
    }
    .bottom-nav button {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; color: var(--text-dimmer); font-size: 10.5px; font-weight: 600; transition: color .15s; padding-top: 4px;
    }
    .bottom-nav button.active { color: var(--accent); }
    .bottom-nav button.active svg { filter: drop-shadow(0 0 8px rgba(0,180,216,.6)); }

    /* ============ PAGE / SECTIONS ============ */
    main { padding-top: 16px; padding-bottom: 24px; min-height: 60vh; }
    .page { display: none; animation: fade .25s ease; }
    .page.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .section-title { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 12px; }
    .section-title h2 { font-size: 19px; font-weight: 800; }
    .section-title a { font-size: 13px; color: var(--accent); font-weight: 600; }

    /* Category pills */
    .pills { display: flex; gap: 9px; overflow-x: auto; padding: 4px 0 10px; }
    .pill {
      flex: 0 0 auto; padding: 8px 16px; border-radius: 999px; background: var(--surface);
      border: 1px solid var(--border); color: var(--text-dim); font-size: 13px; font-weight: 600; transition: .15s; white-space: nowrap;
    }
    .pill.active { background: var(--accent); border-color: var(--accent); color: #001318; }
    .pill:hover:not(.active) { color: var(--text); border-color: var(--surface-3); }

    /* Media grid */
    .media-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .card { cursor: pointer; transition: transform .18s; }
    .card:hover { transform: translateY(-3px); }
    .poster {
      position: relative; aspect-ratio: 2/3; border-radius: var(--radius); overflow: hidden;
      background: var(--surface); box-shadow: var(--shadow);
    }
    .poster img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
    .card:hover .poster img { transform: scale(1.06); }
    .poster .badge-tl, .poster .badge-tr, .poster .badge-bl {
      position: absolute; font-size: 10.5px; font-weight: 700; padding: 4px 8px; border-radius: 7px;
      backdrop-filter: blur(6px); display: flex; align-items: center; gap: 4px;
    }
    .poster .badge-tl { top: 8px; inset-inline-start: 8px; background: rgba(0,0,0,.6); color: #fff; }
    .poster .badge-tr { top: 8px; inset-inline-end: 8px; background: rgba(245,179,1,.92); color: #1a1200; }
    .poster .badge-bl { bottom: 8px; inset-inline-start: 8px; background: rgba(0,180,216,.92); color: #001318; }
    .card-body { padding: 9px 2px 0; }
    .card-title { font-size: 13.5px; font-weight: 700; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .genre-chip { font-size: 10px; background: var(--surface); border: 1px solid var(--border); padding: 2px 7px; border-radius: 6px; color: var(--text-dim); }

    /* Franchise banner cards */
    .franchise-list { display: grid; gap: 14px; }
    .franchise {
      position: relative; border-radius: var(--radius); overflow: hidden; min-height: 150px;
      display: flex; align-items: flex-end; box-shadow: var(--shadow); cursor: pointer;
    }
    .franchise img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .franchise::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(13,13,13,.92) 0%, rgba(13,13,13,.4) 60%, transparent 100%); }
    html[dir="ltr"] .franchise::after { background: linear-gradient(90deg, rgba(13,13,13,.92) 0%, rgba(13,13,13,.4) 60%, transparent 100%); }
    .franchise-body { position: relative; z-index: 2; padding: 16px; }
    .franchise-body h3 { font-size: 18px; font-weight: 800; }
    .franchise-count { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 700; background: var(--accent); color: #001318; padding: 3px 10px; border-radius: 999px; }
    .rating-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .rating-badge { font-size: 11px; font-weight: 700; background: rgba(0,0,0,.5); border: 1px solid var(--border); padding: 4px 8px; border-radius: 7px; display: flex; align-items: center; gap: 5px; }
    .rating-badge.imdb { color: var(--gold); }

    /* ============ DETAIL PAGE ============ */
    .detail-hero { position: relative; margin: -16px -16px 0; }
    .detail-hero .backdrop { width: 100%; aspect-ratio: 16/9; max-height: 460px; object-fit: cover; }
    .detail-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(13,13,13,.15) 0%, rgba(13,13,13,.7) 60%, var(--bg) 100%); }
    .detail-hero .hero-content { position: absolute; z-index: 2; inset-inline: 0; bottom: 0; padding: 16px; display: flex; gap: 14px; align-items: flex-end; }
    .detail-hero .hero-poster { width: 92px; flex: 0 0 auto; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); aspect-ratio: 2/3; }
    .detail-hero .hero-poster img { width: 100%; height: 100%; object-fit: cover; }
    .detail-meta h1 { font-size: 21px; font-weight: 800; line-height: 1.25; }
    .detail-meta .sub { font-size: 12.5px; color: var(--text-dim); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .player-wrap {
      position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: var(--radius);
      overflow: hidden; margin-top: 18px; box-shadow: var(--shadow);
    }
    .player-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .player-placeholder { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-dim); gap: 10px; text-align: center; padding: 20px; }

    .action-bar { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .action-btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border); color: var(--text); font-weight: 600; font-size: 13.5px; transition: .15s;
    }
    .action-btn:hover { background: var(--surface-2); }
    .action-btn.active { color: var(--accent); border-color: var(--accent); }
    .action-btn.like.active { color: #ff5c78; border-color: #ff5c78; }
    .action-btn.like.active svg { fill: #ff5c78; }
    .action-btn.bookmark.active svg { fill: var(--accent); }
    .action-btn .spin { animation: spin .8s linear infinite; }

    .watch-cta {
      display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
      margin-top: 16px; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 800;
      background: linear-gradient(135deg,var(--accent),var(--accent-2)); color: #001318;
      box-shadow: 0 8px 24px rgba(0,180,216,.3); transition: transform .15s;
    }
    .watch-cta:active { transform: scale(.98); }

    .synopsis { margin-top: 18px; color: var(--text-dim); font-size: 14px; }
    .synopsis.clamped p { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .read-more { color: var(--accent); font-weight: 700; font-size: 13px; margin-top: 6px; }

    /* Episode selector */
    .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; margin-top: 14px; }
    .ep-btn {
      aspect-ratio: 1; border-radius: 9px; background: var(--surface); border: 1px solid var(--border);
      color: var(--text-dim); font-weight: 700; font-size: 13px; transition: .15s;
    }
    .ep-btn:hover { background: var(--surface-2); color: var(--text); }
    .ep-btn.active { background: var(--accent); border-color: var(--accent); color: #001318; box-shadow: 0 4px 14px rgba(0,180,216,.35); }

    /* Comments */
    .comment-form { display: flex; gap: 10px; margin-top: 14px; align-items: flex-start; }
    .comment-form .c-avatar { width: 40px; height: 40px; border-radius: 50%; flex: 0 0 auto; background: var(--surface-2); display: grid; place-items: center; font-weight: 700; overflow: hidden; }
    .comment-form .c-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .comment-input-wrap { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .comment-input-wrap textarea {
      width: 100%; resize: vertical; min-height: 44px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 13px; color: var(--text); font-size: 14px;
    }
    .comment-input-wrap textarea:focus { outline: none; border-color: var(--accent); }
    .comment-submit { align-self: flex-end; padding: 9px 20px; border-radius: 9px; background: var(--accent); color: #001318; font-weight: 700; font-size: 13px; }
    .comment-submit:disabled { opacity: .5; cursor: not-allowed; }

    .comment-list { display: flex; flex-direction: column; gap: 16px; margin-top: 20px; }
    .comment {
      display: flex; gap: 12px;
    }
    .comment .c-avatar { width: 40px; height: 40px; border-radius: 50%; flex: 0 0 auto; background: linear-gradient(135deg,#3a3a3a,#1f1f1f); display: grid; place-items: center; font-weight: 700; overflow: hidden; }
    .comment .c-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .comment-content { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; }
    .comment-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .comment-head .name { font-weight: 700; font-size: 13.5px; }
    .comment-head .time { font-size: 11px; color: var(--text-dimmer); }
    .comment-text { font-size: 14px; color: #e6e6e6; word-break: break-word; white-space: pre-wrap; }

    /* ============ PROFILE ============ */
    .profile-banner { position: relative; height: 160px; margin: -16px -16px 0; background: var(--surface); overflow: hidden; }
    .profile-banner img { width: 100%; height: 100%; object-fit: cover; }
    .profile-banner::after { content:""; position:absolute; inset:0; background: linear-gradient(180deg, transparent, rgba(13,13,13,.7)); }
    .profile-head { display: flex; align-items: flex-end; gap: 16px; margin-top: -46px; position: relative; z-index: 2; padding: 0 4px; }
    .profile-avatar {
      width: 92px; height: 92px; border-radius: 50%; border: 4px solid var(--bg);
      background: linear-gradient(135deg,var(--accent),var(--accent-2)); display: grid; place-items: center;
      font-size: 34px; font-weight: 800; color: #001318; overflow: hidden; flex: 0 0 auto;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-info { flex: 1; padding-bottom: 6px; }
    .profile-info h2 { font-size: 20px; font-weight: 800; }
    .profile-info .username { color: var(--text-dim); font-size: 13.5px; }
    .profile-info .bio { color: var(--text-dim); font-size: 13.5px; margin-top: 6px; }

    .profile-tabs { display: flex; gap: 6px; overflow-x: auto; margin-top: 20px; border-bottom: 1px solid var(--border); }
    .profile-tab { padding: 12px 14px; font-size: 14px; font-weight: 600; color: var(--text-dim); white-space: nowrap; border-bottom: 2px solid transparent; transition: .15s; }
    .profile-tab.active { color: var(--text); border-color: var(--accent); }

    .empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 40px 20px; gap: 14px; }
    .empty-state img { width: 140px; height: 140px; object-fit: contain; opacity: .95; }
    .empty-state h3 { font-size: 16px; font-weight: 700; }
    .empty-state p { font-size: 13.5px; color: var(--text-dim); max-width: 300px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 10px; font-weight: 700; font-size: 14px; transition: .15s; }
    .btn-primary { background: var(--accent); color: #001318; }
    .btn-primary:hover { background: #16c2e8; }
    .btn-ghost { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover { background: var(--surface-2); }
    .btn-block { width: 100%; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }

    /* ============ SETTINGS FORMS ============ */
    .settings-wrap { max-width: 640px; margin: 0 auto; }
    .settings-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-top: 18px; }
    .settings-card h3 { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
    .settings-card .card-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; }
    .field { margin-bottom: 15px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 7px; color: var(--text-dim); }
    .field input, .field textarea {
      width: 100%; background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; color: var(--text); font-size: 14px;
    }
    .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
    .field input:disabled { opacity: .6; cursor: not-allowed; }
    .field .helper { font-size: 11.5px; color: var(--text-dimmer); margin-top: 6px; }
    .field .helper.locked { color: var(--gold); }
    .upload-row { display: flex; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
    .upload-zone { position: relative; }
    .upload-zone .zone-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--bg-2); border: 1px dashed var(--surface-3); display: grid; place-items: center; overflow: hidden; }
    .upload-zone .zone-cover { width: 100%; height: 90px; border-radius: 10px; background: var(--bg-2); border: 1px dashed var(--surface-3); display: grid; place-items: center; overflow: hidden; }
    .upload-zone .change-badge { position: absolute; bottom: -4px; inset-inline-end: -4px; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #001318; display: grid; place-items: center; border: 3px solid var(--surface); }
    .upload-zone.cover { flex: 1; min-width: 200px; }

    /* ============ MODAL ============ */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,.72);
      backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; animation: fade .2s ease; }
    .modal {
      background: var(--bg-2); border: 1px solid var(--border); border-radius: 18px;
      width: 100%; max-width: 400px; padding: 26px 22px; box-shadow: var(--shadow);
      max-height: 92vh; overflow-y: auto; animation: pop .25s cubic-bezier(.2,.8,.3,1.2);
    }
    @keyframes pop { from { transform: translateY(14px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .modal-head h2 { font-size: 21px; font-weight: 800; }
    .modal .sub { color: var(--text-dim); font-size: 13.5px; margin-bottom: 18px; }
    .google-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;

    }
    .google-btn:hover { background: #f0f0f0; }
    .google-btn:disabled { opacity: .6; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: var(--text-dimmer); font-size: 12px; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .auth-error { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.4); color: #ffb4b4; font-size: 13px; padding: 10px 12px; border-radius: 9px; margin-bottom: 14px; display: none; }
    .auth-error.show { display: block; }
    .auth-success { background: rgba(0,168,150,.12); border: 1px solid rgba(0,168,150,.4); color: #8ff0e5; font-size: 13px; padding: 10px 12px; border-radius: 9px; margin-bottom: 14px; display: none; }
    .auth-success.show { display: block; }
    .modal-switch { text-align: center; font-size: 13.5px; color: var(--text-dim); margin-top: 16px; }
    .modal-switch button { color: var(--accent); font-weight: 700; }
    .link-btn { color: var(--accent); font-weight: 600; font-size: 13px; }

    /* ============ TOAST ============ */
    .toast-wrap { position: fixed; bottom: calc(var(--bottomnav-h) + 20px); inset-inline: 0; z-index: 400; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
    .toast {
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
      padding: 11px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 9px; animation: toastIn .3s ease;
    }
    .toast.success { border-color: var(--accent-2); }
    .toast.error { border-color: var(--danger); }
    @keyframes toastIn { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }

    /* ============ LOADERS ============ */
    .spinner { width: 20px; height: 20px; border: 2.5px solid rgba(255,255,255,.2); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    .spinner.lg { width: 40px; height: 40px; border-width: 4px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .center-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 60px 20px; color: var(--text-dim); }

    .skeleton { background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: var(--radius); }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skel-poster { aspect-ratio: 2/3; }

    /* Boot overlay */
    #boot { position: fixed; inset: 0; z-index: 500; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .4s; }
    #boot .logo-mark { width: 60px; height: 60px; border-radius: 16px; background: linear-gradient(135deg,var(--accent),var(--accent-2)); display: grid; place-items: center; color: #001318; font-weight: 800; font-size: 26px; box-shadow: 0 8px 30px rgba(0,180,216,.4); }
    #boot .brand-text { font-size: 22px; font-weight: 800; }

    /* ============ RESPONSIVE ============ */
    @media (min-width: 640px) {
      .media-grid { grid-template-columns: repeat(3, 1fr); }
      .detail-hero .hero-poster { width: 120px; }
      .detail-meta h1 { font-size: 26px; }
    }
    @media (min-width: 900px) {
      :root { --header-h: 68px; }
      body { padding-bottom: 30px; }

      .desktop-nav { display: flex; }
      .hamburger { display: none; }

      main { padding-top: 22px; }

      .ep-grid { grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); }
    }

      .media-grid { grid-template-columns: repeat(5, 1fr); }
      .franchise-list { grid-template-columns: repeat(3, 1fr); }
    }

    function buildNav() {
      const desktop = document.getElementById("desktopNav");

      desktop.innerHTML = "";
      drawer.innerHTML = "";
      NAV_ITEMS.forEach(item => {
        const a = document.createElement("a");
        a.href = "#/" + item.id;
        a.dataset.nav = item.id;
        a.textContent = t(item.id);
        desktop.appendChild(a);

        const da = document.createElement("a");
        da.href = "#/" + item.id;
        da.dataset.nav = item.id;
        da.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${item.icon}"/></svg><span>${t(item.id)}</span>`;

      });
      highlightNav();
    }

    function highlightNav() {
      const route = currentRoute().page;
      document.querySelectorAll("[data-nav]").forEach(el => {
        el.classList.toggle("active", el.dataset.nav === route);
      });
    }

    function currentRoute() {
      // Support both #/drama/ID and ?drama=ID (Blogger friendly)
      const hash = location.hash.replace(/^#\//, "");
      const parts = hash.split("/").filter(Boolean);
      const params = new URLSearchParams(location.search);
      if (params.get("drama")) return { page: "detail", id: params.get("drama") };
      if (parts[0] === "drama" && parts[1]) return { page: "detail", id: decodeURIComponent(parts[1]) };
      const page = parts[0] || "home";
      return { page, id: parts[1] || null };
    }

    function navigate(page, id) {
      if (page === "detail" && id) location.hash = "#/drama/" + encodeURIComponent(id);
      else location.hash = "#/" + page;

      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));

    async function loadDrama(id) {
      currentDramaId = id;
      const page = document.getElementById("page-detail");
      page.innerHTML = `<div class="center-loader"><div class="spinner lg"></div><span>${t("loading")}</span></div>`;

      // stop any previous comment listener
      if (commentsUnsub) { commentsUnsub(); commentsUnsub = null; }

      let data = null;
      try {
        const ref = doc(db, "dramas", id);
        const snap = await getDoc(ref);
        if (snap.exists()) {
          data = snap.data();
        } else {
          // Seed from catalog if we know this id, else Not Found
          const seedItem = CATALOG.find(c => c.id === id) || FRANCHISES.find(f => f.id === id);
          if (seedItem) {
            const catItem = CATALOG.find(c => c.id === id) || CATALOG.find(c => c.id === seedItem.id) || CATALOG[0];
            data = buildSeedDrama(catItem);
            // Best-effort create the doc so likes/comments/views persist.
            try { await setDoc(ref, data); } catch (e) { console.log("[v0] seed write skipped:", e.code || e.message); }
          }
        }
      } catch (err) {
        console.log("[v0] loadDrama error:", err.code || err.message);
        // If Firestore is unreachable, still try to render from seed for demo.
        const catItem = CATALOG.find(c => c.id === id);
        if (catItem) data = buildSeedDrama(catItem);
      }

      if (!data) { renderNotFound(); return; }
      currentDrama = data;
      currentEp = 1;
      renderDetail(data, id);
      incrementView(id);        // efficient, once per session per drama
      listenComments(id);       // realtime
    }

            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>

          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>
          ${t("watch")}
        </button>

        <div class="section-title"><h2>${t("episodes")}</h2></div>

      renderEpisodes(d.episodes || []);
      renderCommentComposer(id);

    function renderEpisodes(episodes) {
      const grid = document.getElementById("epGrid");
      if (!episodes.length) { grid.innerHTML = `<p style="color:var(--text-dim)">—</p>`; return; }
      grid.innerHTML = episodes.map(ep =>
        `<button class="ep-btn ${ep.epNumber===currentEp?"active":""}" data-ep="${ep.epNumber}">${ep.epNumber}</button>`
      ).join("");
      grid.querySelectorAll("[data-ep]").forEach(b => b.addEventListener("click", () => playEpisode(parseInt(b.dataset.ep,10))));
    }

    function playEpisode(n) {
      const ep = (currentDrama.episodes||[]).find(e => e.epNumber === n);
      if (!ep) return;
      currentEp = n;
      // Update episode active state
      document.querySelectorAll("#epGrid [data-ep]").forEach(b => b.classList.toggle("active", parseInt(b.dataset.ep,10)===n));
      // Swap iframe src WITHOUT page reload
      const wrap = document.getElementById("playerWrap");
      wrap.innerHTML = `<iframe src="${esc(ep.embedUrl)}" title="${t("episode")} ${n}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>`;
      // Update URL state (hash) without reloading
      history.replaceState(null, "", `#/drama/${encodeURIComponent(currentDramaId)}`);
    }

    function wireDetailActions(id) {
      // Read more toggle
      const syn = document.getElementById("synopsis");
      const rm = document.getElementById("readMoreBtn");
      rm.addEventListener("click", () => {
        syn.classList.toggle("clamped");
        rm.textContent = syn.classList.contains("clamped") ? t("readMore") : t("readLess");
      });
      // Watch CTA -> play episode 1
      document.getElementById("watchCta").addEventListener("click", () => {
        playEpisode(currentEp || 1);
        document.getElementById("playerWrap").scrollIntoView({ behavior: "smooth", block: "center" });
      });
      // Like
      document.getElementById("likeBtn").addEventListener("click", () => toggleLike(id));
      // Bookmark
      document.getElementById("bookmarkBtn").addEventListener("click", () => toggleBookmark(id));
      // Share
      document.getElementById("shareBtn").addEventListener("click", () => shareDrama(id));
    }

    /* =================================================================
       VIEW COUNTER  (once per session per drama)
       ================================================================= */
    async function incrementView(id) {
      if (viewCounted.has(id)) return;
      viewCounted.add(id);
      sessionStorage.setItem("ld_viewed", JSON.stringify([...viewCounted]));
      try {
        await updateDoc(doc(db, "dramas", id), { "stats.viewsCount": increment(1) });
        const vc = document.getElementById("viewCount");
        if (vc) vc.textContent = (parseInt(vc.textContent||"0",10) + 1);
      } catch (e) { console.log("[v0] view increment skipped:", e.code||e.message); }
    }

    /* =================================================================
       LIKE SYSTEM (user-specific, atomic, no duplicates)
       ================================================================= */
    let likeBusy = false;
    async function toggleLike(id) {
      if (!auth.currentUser) { openAuth("login"); return; }
      if (likeBusy) return; likeBusy = true;
      const btn = document.getElementById("likeBtn");
      const uid = auth.currentUser.uid;
      const wasLiked = btn.classList.contains("active");
      const countEl = document.getElementById("likeCount");
      // Optimistic UI
      btn.classList.toggle("active");
      btn.querySelector("svg").setAttribute("fill", wasLiked ? "none" : "currentColor");
      countEl.textContent = Math.max(0, parseInt(countEl.textContent||"0",10) + (wasLiked ? -1 : 1));
      try {
        await updateDoc(doc(db, "dramas", id), {
          "stats.likedByUsers": wasLiked ? arrayRemove(uid) : arrayUnion(uid),
          "stats.likesCount": increment(wasLiked ? -1 : 1)
        });
        // keep local copy in sync
        currentDrama.stats.likedByUsers = currentDrama.stats.likedByUsers || [];
        if (wasLiked) currentDrama.stats.likedByUsers = currentDrama.stats.likedByUsers.filter(u=>u!==uid);
        else currentDrama.stats.likedByUsers.push(uid);
      } catch (e) {
        // rollback
        btn.classList.toggle("active");
        btn.querySelector("svg").setAttribute("fill", wasLiked ? "currentColor" : "none");
        countEl.textContent = Math.max(0, parseInt(countEl.textContent||"0",10) + (wasLiked ? 1 : -1));
        toast(friendlyError(e), "error");
      } finally { likeBusy = false; }
    }

    /* =================================================================
       BOOKMARK SYSTEM (users/{uid}.favorites + drama bookmarkedByUsers)
       ================================================================= */
    let bmBusy = false;
    async function toggleBookmark(id) {
      if (!auth.currentUser) { openAuth("login"); return; }
      if (bmBusy) return; bmBusy = true;
      const btn = document.getElementById("bookmarkBtn");
      const uid = auth.currentUser.uid;
      const wasSaved = btn.classList.contains("active");
      btn.classList.toggle("active");
      btn.querySelector("svg").setAttribute("fill", wasSaved ? "none" : "currentColor");
      try {
        const batch = writeBatch(db);
        batch.update(doc(db, "users", uid), { favorites: wasSaved ? arrayRemove(id) : arrayUnion(id) });
        batch.update(doc(db, "dramas", id), { "stats.bookmarkedByUsers": wasSaved ? arrayRemove(uid) : arrayUnion(uid) });
        await batch.commit();
        if (userProfile) {
          userProfile.favorites = userProfile.favorites || [];
          if (wasSaved) userProfile.favorites = userProfile.favorites.filter(x=>x!==id);
          else userProfile.favorites.push(id);
        }
        toast(wasSaved ? "—" : t("savedOk"), "success");
      } catch (e) {
        btn.classList.toggle("active");
        btn.querySelector("svg").setAttribute("fill", wasSaved ? "currentColor" : "none");
        toast(friendlyError(e), "error");
      } finally { bmBusy = false; }
    }

    /* =================================================================
       SHARE
       ================================================================= */
    async function shareDrama(id) {
      const url = location.origin + location.pathname + "#/drama/" + encodeURIComponent(id);
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(url);
        } else {
          // Fallback
          const ta = document.createElement("textarea");
          ta.value = url; ta.style.position="fixed"; ta.style.opacity="0";
          document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
        }
        toast(t("linkCopied"), "success");
      } catch (e) { toast(url, "success"); }
    }

    /* =================================================================
       COMMENTS SYSTEM (realtime onSnapshot, addDoc, sanitized)
       ================================================================= */
    function renderCommentComposer(id) {
      const section = document.getElementById("commentSection");
      const signedIn = !!auth.currentUser;
      const avatarUrl = auth.currentUser && auth.currentUser.photoURL;
      const initial = (userProfile && userProfile.displayName ? userProfile.displayName : (auth.currentUser && auth.currentUser.displayName) || "?").charAt(0).toUpperCase();
      section.innerHTML = `
        ${signedIn ? `
          <div class="comment-form">
            <div class="c-avatar">${avatarUrl?`<img src="${esc(avatarUrl)}" alt="" crossorigin="anonymous"/>`:esc(initial)}</div>
            <div class="comment-input-wrap">
              <textarea id="commentInput" rows="1" maxlength="1000" placeholder="${t("writeComment")}"></textarea>
              <button class="comment-submit" id="commentSubmit">${t("send")}</button>
            </div>
          </div>` : `
          <div class="empty-state" style="padding:24px;">
            <p>${t("loginToComment")}</p>
            <button class="btn btn-primary" id="commentLoginBtn">${t("signIn")}</button>
          </div>`}
        <div class="comment-list" id="commentList">
          <div class="center-loader"><div class="spinner"></div></div>
        </div>`;

      if (signedIn) {
        const input = document.getElementById("commentInput");
        input.addEventListener("input", () => { input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,160)+"px"; });
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey && !e.nativeEvent?.isComposing && e.keyCode !== 229) {
            e.preventDefault(); submitComment(id);
          }
        });
        document.getElementById("commentSubmit").addEventListener("click", () => submitComment(id));
      } else {
        document.getElementById("commentLoginBtn").addEventListener("click", () => openAuth("login"));
      }
    }

    function listenComments(id) {
      const q = query(collection(db, "dramas", id, "comments"), orderBy("timestamp", "desc"));
      commentsUnsub = onSnapshot(q, (snap) => {
        const list = document.getElementById("commentList");
        if (!list) return;
        if (snap.empty) {
          list.innerHTML = `<div class="empty-state" style="padding:26px;"><img src="/empty-state.png" alt="" style="width:96px;height:96px;"/><p>${t("noComments")}</p></div>`;
          return;
        }
        const rows = [];
        snap.forEach(docSnap => {
          const c = docSnap.data();
          const ts = c.timestamp && c.timestamp.toDate ? c.timestamp.toDate() : new Date();
          const initial = (c.username||"?").charAt(0).toUpperCase();
          rows.push(`
            <div class="comment">
              <div class="c-avatar">${c.avatar?`<img src="${esc(c.avatar)}" alt="" crossorigin="anonymous"/>`:esc(initial)}</div>
              <div class="comment-content">
                <div class="comment-head"><span class="name">${esc(c.username||"User")}</span><span class="time">${timeAgo(ts)}</span></div>
                <div class="comment-text">${esc(c.text||"")}</div>
              </div>
            </div>`);
        });
        list.innerHTML = rows.join("");
      }, (err) => {
        console.log("[v0] comments listen error:", err.code||err.message);
        const list = document.getElementById("commentList");
        if (list) list.innerHTML = `<p style="color:var(--text-dim);padding:20px;">${t("noComments")}</p>`;
      });
    }

    let commentBusy = false;
    async function submitComment(id) {
      if (!auth.currentUser) { openAuth("login"); return; }
      const input = document.getElementById("commentInput");
      const text = (input.value || "").trim();
      if (!text) { toast(t("commentEmpty"), "error"); return; }
      if (commentBusy) return; commentBusy = true;
      const btn = document.getElementById("commentSubmit");
      btn.disabled = true; btn.innerHTML = `<span class="spinner" style="width:14px;height:14px;"></span>`;
      try {
        const uname = (userProfile && userProfile.username) || (userProfile && userProfile.displayName) || auth.currentUser.displayName || "User";
        await addDoc(collection(db, "dramas", id, "comments"), {
          uid: auth.currentUser.uid,
          username: uname,
          avatar: auth.currentUser.photoURL || "",
          text: text,                        // stored raw; ALWAYS rendered via esc()
          timestamp: serverTimestamp()
        });
        input.value = ""; input.style.height = "auto";
      } catch (e) {
        toast(friendlyError(e), "error");
      } finally {
        commentBusy = false; btn.disabled = false; btn.textContent = t("send");
      }
    }

    /* =================================================================
       AUTHENTICATION
       ================================================================= */
    let userProfile = null;   // Firestore users/{uid} document
    let authMode = "login";   // login | register | reset

    const authModal   = document.getElementById("authModal");
    const authForm    = document.getElementById("authForm");
    const authError   = document.getElementById("authError");
    const authSuccess = document.getElementById("authSuccess");

    function openAuth(mode) {
      authMode = mode;
      clearAuthMsg();
      authForm.reset();
      const title = document.getElementById("authTitle");
      const sub   = document.getElementById("authSub");
      const submit= document.getElementById("authSubmit");
      const nameField = document.getElementById("nameField");
      const passField = document.getElementById("passField");
      const forgotRow = document.getElementById("forgotRow");
      const googleBtn = document.getElementById("googleBtn");
      const divider   = authModal.querySelector(".divider");
      const switchP   = document.getElementById("authSwitch");

      nameField.classList.toggle("hidden", mode !== "register");
      passField.classList.toggle("hidden", mode === "reset");
      forgotRow.classList.toggle("hidden", mode !== "login");
      googleBtn.classList.toggle("hidden", mode === "reset");
      divider.classList.toggle("hidden", mode === "reset");

      if (mode === "login") {
        title.textContent = t("loginTitle"); sub.textContent = t("loginSub"); submit.textContent = t("login");
        switchP.innerHTML = `${t("noAccount")} <button type="button" data-mode="register">${t("signUp")}</button>`;
      } else if (mode === "register") {
        title.textContent = t("registerTitle"); sub.textContent = t("registerSub"); submit.textContent = t("register");
        switchP.innerHTML = `${t("haveAccount")} <button type="button" data-mode="login">${t("signIn")}</button>`;
      } else {
        title.textContent = t("forgotPassword"); sub.textContent = t("email"); submit.textContent = t("send");
        switchP.innerHTML = `${t("haveAccount")} <button type="button" data-mode="login">${t("signIn")}</button>`;
      }
      switchP.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => openAuth(b.dataset.mode)));
      authModal.classList.add("open");
    }
    function closeAuth() { authModal.classList.remove("open"); }
    function clearAuthMsg() { authError.classList.remove("show"); authSuccess.classList.remove("show"); }
    function showAuthError(msg) { authError.textContent = msg; authError.classList.add("show"); authSuccess.classList.remove("show"); }
    function showAuthSuccess(msg) { authSuccess.textContent = msg; authSuccess.classList.add("show"); authError.classList.remove("show"); }

    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAuthMsg();
      const email = document.getElementById("authEmail").value.trim();
      const pass  = document.getElementById("authPass").value;
      const name  = document.getElementById("authName").value.trim();
      const submit = document.getElementById("authSubmit");
      const orig = submit.textContent;
      submit.disabled = true; submit.innerHTML = `<span class="spinner" style="width:16px;height:16px;"></span>`;
      try {
        if (authMode === "login") {
          await signInWithEmailAndPassword(auth, email, pass);
          closeAuth();
        } else if (authMode === "register") {
          const cred = await createUserWithEmailAndPassword(auth, email, pass);
          if (name) await updateProfile(cred.user, { displayName: name });
          await ensureUserDoc(cred.user, { displayName: name });
          closeAuth();
        } else if (authMode === "reset") {
          await sendPasswordResetEmail(auth, email);
          showAuthSuccess(t("resetSent"));
        }
      } catch (err) {
        showAuthError(friendlyError(err));
      } finally {
        submit.disabled = false; submit.textContent = orig;
      }
    });

    document.getElementById("googleBtn").addEventListener("click", async () => {
      clearAuthMsg();
      const btn = document.getElementById("googleBtn");
      btn.disabled = true;
      try {
        const res = await signInWithPopup(auth, googleProvider);
        await ensureUserDoc(res.user, {});
        closeAuth();
      } catch (err) {
        showAuthError(friendlyError(err));
      } finally { btn.disabled = false; }
    });

    document.getElementById("forgotBtn").addEventListener("click", () => openAuth("reset"));
    document.getElementById("authClose").addEventListener("click", closeAuth);
    authModal.addEventListener("click", (e) => { if (e.target === authModal) closeAuth(); });

    /* Create Firestore user doc if it doesn't already exist (keep existing data) */
    async function ensureUserDoc(user, extra) {
      const ref = doc(db, "users", user.uid);
      try {
        const snap = await getDoc(ref);
        if (!snap.exists()) {
          const base = {
            uid: user.uid,
            displayName: extra.displayName || user.displayName || "User",
            username: (user.email ? user.email.split("@")[0] : "user").replace(/[^a-z0-9_]/gi,"").toLowerCase() || "user",
            email: user.email || "",
            bio: "",
            photoURL: user.photoURL || "",
            coverURL: "",
            favorites: [],
            watchLater: []
          };
          await setDoc(ref, base);
          userProfile = base;
        } else {
          userProfile = snap.data();
        }
      } catch (e) {
        console.log("[v0] ensureUserDoc error:", e.code||e.message);
        // Fallback minimal profile so UI still works offline
        userProfile = { uid:user.uid, displayName:user.displayName||"User", username:(user.email||"user").split("@")[0], email:user.email||"", bio:"", photoURL:user.photoURL||"", coverURL:"", favorites:[], watchLater:[] };
      }
    }

    onAuthStateChanged(auth, async (user) => {
      const avatarInitial = document.getElementById("avatarInitial");
      const avatarBtn = document.getElementById("avatarBtn");
      if (user) {
        await ensureUserDoc(user, {});
        const label = (userProfile.displayName || "U").charAt(0).toUpperCase();
        avatarBtn.innerHTML = user.photoURL
          ? `<img src="${esc(user.photoURL)}" alt="${esc(userProfile.displayName)}" crossorigin="anonymous"/>`
          : `<span>${esc(label)}</span>`;
      } else {
        userProfile = null;
        avatarBtn.innerHTML = `<span>G</span>`;
      }
      // Re-render whatever is on screen so auth-dependent UI updates
      handleRoute();
      hideBoot();
    });

              <div class="upload-zone cover">
                <div class="zone-cover">${p.coverURL?`<img src="${esc(p.coverURL)}" alt="" style="width:100%;height:100%;object-fit:cover;" crossorigin="anonymous"/>`:`<span style="color:var(--text-dimmer);font-size:12px;">${t("cover")}</span>`}</div>
                <span class="change-badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
              </div>
            </div>
            <form id="profileForm">
              <div class="field">
                <label>${t("displayName")}</label>
                <input type="text" id="setName" value="${esc(p.displayName||"")}" />
              </div>
              <div class="field">
                <label>${t("username")}</label>
                <input type="text" id="setUsername" value="${esc(p.username||"")}" pattern="[a-z0-9_]+" />
                <div class="helper">${t("usernameHelper")}</div>
              </div>
              <div class="field">
                <label>${t("email")}</label>
                <input type="email" value="${esc(p.email||"")}" disabled />
                ${isGoogle?`<div class="helper locked">${t("emailLocked")}</div>`:""}
              </div>
              <div class="field">
                <label>${t("bio")}</label>
                <textarea id="setBio" rows="3">${esc(p.bio||"")}</textarea>
              </div>
              <button type="submit" class="btn btn-primary" id="saveProfileBtn">${t("saveChanges")}</button>
            </form>
          </div>

          <!-- Security / password -->
          <div class="settings-card">
            <h3>${t("security")}</h3>
            <p class="card-sub">${t("securitySub")}</p>
            ${isGoogle ? `<p style="color:var(--text-dim);font-size:13px;">${t("emailLocked")}</p>` : `
            <form id="passwordForm">
              <div class="field"><label>${t("currentPassword")}</label><input type="password" id="curPass" autocomplete="current-password" /></div>
              <div class="field"><label>${t("newPassword")}</label><input type="password" id="newPass" autocomplete="new-password" /></div>
              <div class="field"><label>${t("confirmPassword")}</label><input type="password" id="confPass" autocomplete="new-password" /></div>
              <button type="submit" class="btn btn-primary" id="savePassBtn">${t("saveChanges")}</button>
            </form>`}
          </div>
        </div>`;

      // Save profile info
      document.getElementById("profileForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("saveProfileBtn");
        btn.disabled = true; const orig = btn.textContent; btn.innerHTML = `<span class="spinner" style="width:16px;height:16px;"></span>`;
        try {
          const name = document.getElementById("setName").value.trim();
          const username = document.getElementById("setUsername").value.trim().toLowerCase().replace(/[^a-z0-9_]/g,"");
          const bio = document.getElementById("setBio").value.trim();
          await updateDoc(doc(db, "users", auth.currentUser.uid), { displayName: name, username, bio });
          if (name && name !== auth.currentUser.displayName) await updateProfile(auth.currentUser, { displayName: name });
          userProfile = { ...userProfile, displayName: name, username, bio };
          toast(t("profileUpdated"), "success");
          onAuthAvatarRefresh();
        } catch (err) { toast(friendlyError(err), "error"); }
        finally { btn.disabled = false; btn.textContent = orig; }
      });

      // Change password (reauth then update)
      const pf = document.getElementById("passwordForm");
      if (pf) pf.addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("savePassBtn");
        const cur = document.getElementById("curPass").value;
        const np  = document.getElementById("newPass").value;
        const cp  = document.getElementById("confPass").value;
        if (np !== cp) { toast(t("passMismatch"), "error"); return; }
        btn.disabled = true; const orig = btn.textContent; btn.innerHTML = `<span class="spinner" style="width:16px;height:16px;"></span>`;
        try {
          const cred = EmailAuthProvider.credential(auth.currentUser.email, cur);
          await reauthenticateWithCredential(auth.currentUser, cred);
          await updatePassword(auth.currentUser, np);
          toast(t("passwordUpdated"), "success");
          pf.reset();
        } catch (err) { toast(friendlyError(err), "error"); }
        finally { btn.disabled = false; btn.textContent = orig; }
      });
    }
    function onAuthAvatarRefresh() {
      const avatarBtn = document.getElementById("avatarBtn");
      const label = (userProfile.displayName||"U").charAt(0).toUpperCase();
      if (!auth.currentUser.photoURL) avatarBtn.innerHTML = `<span>${esc(label)}</span>`;
    }

    /* =================================================================
       ROUTER DISPATCH
       ================================================================= */
    function handleRoute() {
      const { page, id } = currentRoute();
      highlightNav();
      switch (page) {
        case "home": showPage("home"); renderHome(); break;
        case "movies": showPage("movies"); renderMovies(); break;
        case "series": showPage("series"); renderSeries(); break;
        case "manga": showPage("manga"); renderManga(); break;
        case "franchises": showPage("franchises"); renderFranchisesPage(); break;
        case "detail": showPage("detail"); if (id) loadDrama(id); else renderNotFound(); break;
        case "profile": showPage("profile"); renderProfile(); break;
        case "settings": showPage("settings"); renderSettings(); break;
        case "top250": case "reviews": case "staff": case "about":
          showPage("generic"); renderGeneric(); break;
        default: showPage("home"); renderHome();
      }
      closeDrawer();
    }
    window.addEventListener("hashchange", handleRoute);

    /* =================================================================
       DRAWER + HEADER WIRING
       ================================================================= */
    const drawer = document.getElementById("drawer");
    const drawerOverlay = document.getElementById("drawerOverlay");
    function openDrawer() { drawer.classList.add("open"); drawerOverlay.classList.add("open"); }
    function closeDrawer() { drawer.classList.remove("open"); drawerOverlay.classList.remove("open"); }
    document.getElementById("hamburgerBtn").addEventListener("click", openDrawer);
    document.getElementById("drawerClose").addEventListener("click", closeDrawer);
    drawerOverlay.addEventListener("click", closeDrawer);

    // Bottom nav
    document.getElementById("bottomNav").querySelectorAll("[data-nav]").forEach(b =>
      b.addEventListener("click", () => navigate(b.dataset.nav)));

    // Header extra buttons (search / notif / vip -> gentle placeholders)
    document.getElementById("searchBtn").addEventListener("click", () => toast(t("genericSoon"), "success"));
    document.getElementById("notifBtn").addEventListener("click", () => toast(t("genericSoon"), "success"));
    document.getElementById("vipBtn").addEventListener("click", () => toast("👑 VIP — " + t("genericSoon"), "success"));

    // Language toggle
    document.getElementById("langKu").addEventListener("click", () => { LANG = "ku"; applyLanguage(); });
    document.getElementById("langEn").addEventListener("click", () => { LANG = "en"; applyLanguage(); });

    /* =================================================================
       UTILITIES
       ================================================================= */
    // Safe HTML escaping — used for ALL user-generated content
    function esc(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function timeAgo(date) {
      const s = Math.floor((Date.now() - date.getTime()) / 1000);
      if (s < 60) return t("now");
      const m = Math.floor(s/60); if (m < 60) return m + " " + t("minAgo");
      const h = Math.floor(m/60); if (h < 24) return h + " " + t("hourAgo");
      const d = Math.floor(h/24); return d + " " + t("dayAgo");
    }

    // Friendly bilingual error messages (never expose raw Firebase codes)
    function friendlyError(err) {
      const code = (err && err.code) || "";
      const map = {
        ku: {
          "auth/invalid-email": "ئیمەیڵ نادروستە",
          "auth/user-not-found": "بەکارهێنەر نەدۆزرایەوە",
          "auth/wrong-password": "وشەی نهێنی هەڵەیە",
          "auth/invalid-credential": "زانیاری چوونەژوورەوە هەڵەیە",
          "auth/email-already-in-use": "ئەم ئیمەیڵە پێشتر بەکارهاتووە",
          "auth/weak-password": "وشەی نهێنی لاوازە (لانیکەم ٦ پیت)",
          "auth/popup-closed-by-user": "پەنجەرەی چوونەژوورەوە داخرا",
          "auth/network-request-failed": "کێشەی ئینتەرنێت هەیە",
          "auth/too-many-requests": "هەوڵی زۆر — تکایە دواتر هەوڵبدەوە",
          "permission-denied": "ڕێگەت پێنەدراوە بۆ ئەم کارە",
        },
        en: {
          "auth/invalid-email": "Invalid email address",
          "auth/user-not-found": "No account found",
          "auth/wrong-password": "Incorrect password",
          "auth/invalid-credential": "Invalid login credentials",
          "auth/email-already-in-use": "This email is already in use",
          "auth/weak-password": "Password too weak (min 6 characters)",
          "auth/popup-closed-by-user": "Sign-in popup was closed",
          "auth/network-request-failed": "Network error — check your connection",
          "auth/too-many-requests": "Too many attempts — try again later",
          "permission-denied": "You don't have permission to do that",
        }
      };
      return (map[LANG] && map[LANG][code]) || (LANG==="ku" ? "هەڵەیەک ڕوویدا، تکایە دووبارە هەوڵبدەوە" : "Something went wrong, please try again");
    }

    // Toast notifications
    let toastTimer = null;
    function toast(msg, type) {
      const wrap = document.getElementById("toastWrap");
      const el = document.createElement("div");
      el.className = "toast " + (type||"");
      const icon = type === "success"
        ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`
        : type === "error"
        ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`
        : "";
      el.innerHTML = icon + `<span>${esc(msg)}</span>`;
      wrap.appendChild(el);
      setTimeout(() => { el.style.opacity = "0"; el.style.transition="opacity .3s"; setTimeout(()=>el.remove(), 300); }, 2400);
    }

    function hideBoot() {
      const boot = document.getElementById("boot");
      if (!boot || boot.dataset.done) return;
      boot.dataset.done = "1";
      boot.style.opacity = "0";
      setTimeout(() => boot.remove(), 400);
    }

    /* =================================================================
       INIT
       ================================================================= */
    applyLanguage();     // sets dir, labels, builds nav, and runs handleRoute()
    // Safety: if auth listener is slow, hide boot after 3.5s anyway
    setTimeout(hideBoot, 3500);
  </script>
</body>
</html>
